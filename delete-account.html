<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刪除帳號 - DUEL PROTOCOL 天眼之塔</title>
<style>
  body{font-family:-apple-system,"Noto Sans TC",sans-serif;max-width:560px;margin:40px auto;padding:0 20px;line-height:1.8;color:#222;background:#fafafa}
  .box{background:#fff;padding:30px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  h1{font-size:24px;margin-top:0}
  input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:15px;box-sizing:border-box}
  button{width:100%;padding:13px;margin:8px 0;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600}
  .btn-primary{background:#6c4bd6;color:#fff}
  .btn-google{background:#fff;border:1px solid #ccc;color:#333;display:flex;align-items:center;justify-content:center;gap:10px}
  .btn-danger{background:#c0293e;color:#fff}
  .btn-danger.armed{animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px rgba(192,41,62,.4)}}
  .msg{font-size:14px;padding:10px;border-radius:8px;margin:10px 0}
  .msg.err{background:#fdeaea;color:#a33}
  .msg.ok{background:#e8f7ee;color:#227a4a}
  .hidden{display:none}
  .warn{background:#fff7e6;color:#8a6415;padding:12px;border-radius:8px;font-size:13.5px;margin:16px 0}
  hr{border:none;border-top:1px solid #eee;margin:20px 0}
  small a{color:#6c4bd6}
</style>
</head>
<body>
<div class="box">
  <h1>刪除帳號</h1>
  <p style="color:#666;font-size:14px">DUEL PROTOCOL（天眼之塔）帳號自助刪除頁面</p>

  <div id="step-login">
    <p>請先登入你要刪除的帳號，確認身分後即可永久刪除。</p>
    <button class="btn-google" id="btnGoogle">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.8059.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5831-5.0359-3.7104H.9573v2.3318C2.4382 15.9832 5.4818 18 9 18z"/>
        <path fill="#FBBC05" d="M3.9641 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2822-1.71V4.9582H.9573A8.9965 8.9965 0 0 0 0 9c0 1.4523.3477 2.827.9573 4.0418L3.9641 10.71z"/>
        <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4404 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.9641 7.29C4.6718 5.1627 6.656 3.5795 9 3.5795z"/>
      </svg>
      使用 Google 帳號登入
    </button>
    <hr>
    <input type="email" id="email" placeholder="電子郵件">
    <input type="password" id="password" placeholder="密碼">
    <button class="btn-primary" id="btnEmailLogin">使用 Email 登入</button>
    <div id="loginMsg"></div>
  </div>

  <div id="step-confirm" class="hidden">
    <p>已登入：<b id="whoami"></b></p>
    <div class="warn">⚠️ 刪除後將永久移除你的帳號、雲端存檔、卡牌與天梯紀錄，<b>無法復原</b>。</div>
    <button class="btn-danger" id="btnDelete">刪除我的帳號</button>
    <div id="deleteMsg"></div>
  </div>

  <hr>
  <p style="font-size:13px;color:#888">
    無法登入，或帳號有問題？請寄信到 <b>【請填入你的聯絡信箱】</b>，我們會在收到申請後 30 天內完成刪除。<br>
    <small><a href="./privacy-policy.html">查看隱私權政策</a></small>
  </p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
/* 跟遊戲主程式用同一個 Firebase 專案，帳號、存檔資料完全對得上。 */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC5Ahn8GBtQLtBe-uFqUXR8khXC-IiVWL4",
  authDomain: "tower-of-skyeye-1a2b.firebaseapp.com",
  databaseURL: "https://tower-of-skyeye-1a2b-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tower-of-skyeye-1a2b",
  storageBucket: "tower-of-skyeye-1a2b.firebasestorage.app",
  messagingSenderId: "205629624037",
  appId: "1:205629624037:web:8d64b82b36587584a14e0c"
};
firebase.initializeApp(FIREBASE_CONFIG);

const $ = s => document.querySelector(s);
function showMsg(el, text, ok){
  el.innerHTML = `<div class="msg ${ok?'ok':'err'}">${text}</div>`;
}
function afterLogin(user){
  $('#step-login').classList.add('hidden');
  $('#step-confirm').classList.remove('hidden');
  $('#whoami').textContent = user.email || user.uid;
}

$('#btnGoogle').onclick = async () => {
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const cred = await firebase.auth().signInWithPopup(provider);
    afterLogin(cred.user);
  }catch(e){ showMsg($('#loginMsg'), e.message, false); }
};

$('#btnEmailLogin').onclick = async () => {
  const email = $('#email').value.trim();
  const pw = $('#password').value;
  if(!email || !pw){ showMsg($('#loginMsg'), '請輸入電子郵件與密碼', false); return; }
  try{
    const cred = await firebase.auth().signInWithEmailAndPassword(email, pw);
    afterLogin(cred.user);
  }catch(e){ showMsg($('#loginMsg'), '登入失敗：' + e.message, false); }
};

const delBtn = $('#btnDelete');
delBtn.onclick = async () => {
  if(delBtn.dataset.armed !== '1'){
    delBtn.dataset.armed = '1';
    delBtn.textContent = '確定要刪除嗎？再按一次確認';
    delBtn.classList.add('armed');
    setTimeout(()=>{ delBtn.dataset.armed='0'; delBtn.textContent='刪除我的帳號'; delBtn.classList.remove('armed'); }, 4000);
    return;
  }
  delBtn.disabled = true;
  delBtn.textContent = '刪除中…';
  try{
    const user = firebase.auth().currentUser;
    try{ await firebase.database().ref('players/'+user.uid).remove(); }catch(e){}
    await user.delete();
    showMsg($('#deleteMsg'), '帳號已成功刪除，感謝你曾經來過天眼競技場。', true);
    delBtn.classList.add('hidden');
  }catch(e){
    if(e.code === 'auth/requires-recent-login'){
      showMsg($('#deleteMsg'), '基於安全考量，請重新登入一次後再操作刪除。', false);
      await firebase.auth().signOut();
      setTimeout(()=>location.reload(), 2000);
    }else{
      showMsg($('#deleteMsg'), '刪除失敗：' + e.message, false);
      delBtn.disabled = false;
      delBtn.textContent = '刪除我的帳號';
    }
  }
};
</script>
</body>
</html>
